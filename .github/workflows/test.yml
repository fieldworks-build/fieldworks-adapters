name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: cargo test (unit only)
        run: cargo test --workspace
        # Integration tests require MQTT_TEST_HOST / OPCUA_TEST_HOST.
        # Those env vars are intentionally absent here, so only pure-logic
        # unit tests run. Set the vars in repo secrets and add a second job
        # to enable integration testing against real brokers.

      - name: cargo audit
        run: |
          cargo install cargo-audit --quiet
          cargo audit
