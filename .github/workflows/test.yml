name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: cargo test (unit only)
        run: cargo test --workspace
        # Integration tests require MQTT_TEST_HOST / OPCUA_TEST_HOST.
        # Those env vars are intentionally absent here, so only pure-logic
        # unit tests run. Set the vars in repo secrets and add a second job
        # to enable integration testing against real brokers.

      - name: cargo audit
        run: |
          cargo install cargo-audit --quiet
          cargo audit

  conformance:
    name: Adapter conformance suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build mqtt-mcp, opcua-mcp, and modbus-mcp
        run: |
          cargo build -p mqtt-mcp
          cargo build -p opcua-mcp
          cargo build -p modbus-mcp

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"

      - name: Install fieldworks-core[adapters]
        # 1.7.0 added the known-tag and INVALID_VALUE checks (core#44).
        run: pip install "fieldworks-core[adapters]>=1.7.0"

      - name: Start Mosquitto (anonymous access, conformance testing only)
        run: |
          docker run -d --name mosquitto -p 1883:1883 eclipse-mosquitto:2 \
            sh -c "printf 'listener 1883\nallow_anonymous true\n' > /mosquitto/config/mosquitto.conf && mosquitto -c /mosquitto/config/mosquitto.conf"
          for i in $(seq 1 10); do
            (echo > /dev/tcp/127.0.0.1/1883) >/dev/null 2>&1 && break
            sleep 1
          done
          # A retained topic gives mqtt-mcp's known-tag checks something to
          # read; an empty broker would skip them.
          docker exec mosquitto mosquitto_pub -r -t Plant/Test/Pump01/Flow -m 42.5

      - name: Start Modbus simulator (fixture device, conformance testing only)
        run: |
          pip install -r modbus-mcp/sim/requirements.txt
          python modbus-mcp/sim/simulator.py --port 5502 &
          for i in $(seq 1 10); do
            (echo > /dev/tcp/127.0.0.1/5502) >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Start OPC-UA simulator (fixture server, conformance testing only)
        run: |
          pip install -r opcua-mcp/sim/requirements.txt
          python opcua-mcp/sim/simulator.py --port 4860 &
          for i in $(seq 1 10); do
            (echo > /dev/tcp/127.0.0.1/4860) >/dev/null 2>&1 && break
            sleep 1
          done

      # Every check must run, not skip: a skipped check passes, so a missing
      # fixture would hide a regression. Each step names the checks it
      # expects and fails if the report shows any of them as SKIP.
      - name: fieldworks test-adapter — mqtt-mcp (static + live connection)
        # No INVALID_VALUE check: mqtt-mcp has no fixture topology, so it
        # refuses every write as TAG_NOT_WRITABLE before checking range.
        run: |
          fieldworks test-adapter --command "./target/debug/mqtt-mcp" \
            --host localhost --port 1883 --tag Plant/Test/Pump01/Flow | tee report.txt
          ! grep -E '^\[SKIP\] (discover_tags|read_tag: known|read_tag_history: known|browse/scan|get_topic_tree)' report.txt

      - name: fieldworks test-adapter — opcua-mcp (static + live connection)
        # 127.0.0.1, not localhost: async-opcua's TCP transport only tries
        # the first DNS-resolved address and doesn't fall back — on Linux
        # "localhost" resolves to ::1 first, which nothing is listening on.
        # This lives inside the async-opcua crate, not opcua-mcp's own code,
        # so it's not something to patch here.
        #
        # Runs from sim/ so opcua-mcp loads the fixture topology.yaml: its
        # tags for discover_tags, and write_permissions (SpeedSetpoint,
        # 0-60 Hz) for the INVALID_VALUE check.
        working-directory: opcua-mcp/sim
        run: |
          fieldworks test-adapter --command "$GITHUB_WORKSPACE/target/debug/opcua-mcp" \
            --host 127.0.0.1 --port 4860 \
            --write-tag "ns=2;s=Pump01.SpeedSetpoint" --invalid-value 1e9 | tee report.txt
          ! grep '^\[SKIP\]' report.txt

      - name: fieldworks test-adapter — modbus-mcp (static + live connection)
        # Runs from sim/ for the fixture topology (holding:210 is writable,
        # 0-100 Hz). Modbus scan needs a register range: --scan-args.
        working-directory: modbus-mcp/sim
        run: |
          fieldworks test-adapter --command "$GITHUB_WORKSPACE/target/debug/modbus-mcp" \
            --host localhost --port 5502 \
            --write-tag holding:210 --invalid-value 1e9 \
            --scan-args '{"register_type": "holding", "start_address": 100, "count": 4}' | tee report.txt
          ! grep '^\[SKIP\]' report.txt
