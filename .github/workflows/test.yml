name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: cargo test (unit only)
        run: cargo test --workspace
        # Integration tests require MQTT_TEST_HOST / OPCUA_TEST_HOST.
        # Those env vars are intentionally absent here, so only pure-logic
        # unit tests run. Set the vars in repo secrets and add a second job
        # to enable integration testing against real brokers.

      - name: cargo audit
        run: |
          cargo install cargo-audit --quiet
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2026-0049 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099

  conformance:
    name: Adapter conformance suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build mqtt-mcp and opcua-mcp
        run: |
          cargo build -p mqtt-mcp
          cargo build -p opcua-mcp

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"

      - name: Install fieldworks-core[adapters]
        run: pip install fieldworks-core[adapters]

      - name: Start Mosquitto (anonymous access, conformance testing only)
        run: |
          docker run -d --name mosquitto -p 1883:1883 eclipse-mosquitto:2 \
            sh -c "printf 'listener 1883\nallow_anonymous true\n' > /mosquitto/config/mosquitto.conf && mosquitto -c /mosquitto/config/mosquitto.conf"
          for i in $(seq 1 10); do
            (echo > /dev/tcp/127.0.0.1/1883) >/dev/null 2>&1 && break
            sleep 1
          done

      - name: fieldworks test-adapter — mqtt-mcp (static + live connection)
        run: |
          fieldworks test-adapter --command "./target/debug/mqtt-mcp" \
            --host localhost --port 1883

      - name: fieldworks test-adapter — opcua-mcp (static only)
        # No live OPC-UA server in this job yet — static checks (tool
        # discovery, get_server_info shape) still run unconditionally.
        # Connection-dependent checks need a live server; follow up
        # separately once one's easy to stand up in CI.
        run: |
          fieldworks test-adapter --command "./target/debug/opcua-mcp"
