name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: cargo test (unit only)
        run: cargo test --workspace
        # Integration tests require MQTT_TEST_HOST / OPCUA_TEST_HOST.
        # Those env vars are intentionally absent here, so only pure-logic
        # unit tests run. Set the vars in repo secrets and add a second job
        # to enable integration testing against real brokers.

      - name: cargo audit
        run: |
          cargo install cargo-audit --quiet
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2026-0049 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099

  conformance:
    name: Adapter conformance suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build mqtt-mcp, opcua-mcp, and modbus-mcp
        run: |
          cargo build -p mqtt-mcp
          cargo build -p opcua-mcp
          cargo build -p modbus-mcp

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"

      - name: Install fieldworks-core[adapters]
        run: pip install fieldworks-core[adapters]

      - name: Start Mosquitto (anonymous access, conformance testing only)
        run: |
          docker run -d --name mosquitto -p 1883:1883 eclipse-mosquitto:2 \
            sh -c "printf 'listener 1883\nallow_anonymous true\n' > /mosquitto/config/mosquitto.conf && mosquitto -c /mosquitto/config/mosquitto.conf"
          for i in $(seq 1 10); do
            (echo > /dev/tcp/127.0.0.1/1883) >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Start Modbus simulator (fixture device, conformance testing only)
        run: |
          pip install -r modbus-mcp/sim/requirements.txt
          python modbus-mcp/sim/simulator.py --port 5502 &
          for i in $(seq 1 10); do
            (echo > /dev/tcp/127.0.0.1/5502) >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Start OPC-UA simulator (fixture server, conformance testing only)
        run: |
          pip install -r opcua-mcp/sim/requirements.txt
          python opcua-mcp/sim/simulator.py --port 4860 &
          for i in $(seq 1 10); do
            (echo > /dev/tcp/127.0.0.1/4860) >/dev/null 2>&1 && break
            sleep 1
          done

      - name: fieldworks test-adapter — mqtt-mcp (static + live connection)
        run: |
          fieldworks test-adapter --command "./target/debug/mqtt-mcp" \
            --host localhost --port 1883

      - name: fieldworks test-adapter — opcua-mcp (static + live connection)
        # 127.0.0.1, not localhost: async-opcua's TCP transport only tries
        # the first DNS-resolved address and doesn't fall back — on Linux
        # "localhost" resolves to ::1 first, which nothing is listening on.
        # This lives inside the async-opcua crate, not opcua-mcp's own code,
        # so it's not something to patch here.
        run: |
          fieldworks test-adapter --command "./target/debug/opcua-mcp" \
            --host 127.0.0.1 --port 4860

      - name: fieldworks test-adapter — modbus-mcp (static + live connection)
        run: |
          fieldworks test-adapter --command "./target/debug/modbus-mcp" \
            --host localhost --port 5502
