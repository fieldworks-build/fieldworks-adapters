[package]
name = "mqtt-mcp"
version = "1.0.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP server exposing MQTT as a FieldWorks nine-tool industrial protocol adapter"
readme = "README.md"
keywords = ["mcp", "mqtt", "iot", "industrial", "scada"]
categories = ["network-programming", "hardware-support"]

[dependencies]
# path (local workspace builds) + version (once published) — see fieldworks-adapters#3.
fieldworks-adapter-core = { path = "../fieldworks-adapter-core", version = "1.0" }
rmcp = { version = "3", features = ["transport-io", "schemars"] }
rumqttc = "0.24"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
