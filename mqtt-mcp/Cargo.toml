[package]
name = "mqtt-mcp"
version = "1.0.0"
edition = "2021"

[dependencies]
fieldworks-adapter-core = { path = "../fieldworks-adapter-core" }
rmcp = { version = "1", features = ["transport-io", "schemars"] }
rumqttc = "0.24"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
